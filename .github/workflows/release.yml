# Builds the signed release APK for a version tag (vX.Y.Z or vX.Y.Z-rc.N) and publishes it as a
# GitHub Release, with the notes of that version from CHANGELOG.md. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # proot lives in a git submodule (third_party/proot) and is built from source.
          submodules: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check that the tag matches appVersion
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match appVersion $version"; exit 1; }

      - name: Check and build the release APK
        env:
          UT_KEYSTORE_BASE64: ${{ secrets.UT_KEYSTORE_BASE64 }}
          UT_KEYSTORE_PASSWORD: ${{ secrets.UT_KEYSTORE_PASSWORD }}
          UT_KEY_ALIAS: ${{ secrets.UT_KEY_ALIAS }}
          UT_KEY_PASSWORD: ${{ secrets.UT_KEY_PASSWORD }}
        run: |
          test -n "$UT_KEYSTORE_BASE64" || { echo "UT_KEYSTORE_BASE64 is not set: refusing to publish an unsigned release"; exit 1; }
          export UT_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$UT_KEYSTORE_BASE64" | base64 -d > "$UT_KEYSTORE_FILE"
          ./gradlew check assembleRelease
          rm -f "$UT_KEYSTORE_FILE"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no notes for $version"; exit 1; }
          apk="UltimateTerminal-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          prerelease=""
          case "$version" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" --title "UltimateTerminal $version" --notes-file notes.md $prerelease
